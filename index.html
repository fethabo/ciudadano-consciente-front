<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-simple-color.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ciudadano Consciente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link rel="icon" type="image/svg+xml" href="/loader.webp" />
    <link rel="preload" href="/logo-color.png" as="image">
    <style>
       /* Estilos para la pantalla de carga */
        #loader {
          position: fixed;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          background-color: black; /* Color de fondo */
          z-index: 9999; /* Z-index para asegurar que esté encima de todo */
          display: flex;
          justify-content: center;
          align-items: center;
          transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .loader-container {
          display: flex;
          justify-content: center;
          align-items: center;
          border-radius: 50%; 
          filter:   drop-shadow(0 0 2em #ffb14aaa);
          border-style: none;
          padding: 1em;
        }
        .loader-img {
          /* Estilos para la imagen de carga */
          width: 350px; /* Ancho de la imagen */
          height: 350px; /* Alto de la imagen */
          animation: beat 4s ease-in-out infinite; /* Animación de latido */
        }
        #loader.hidden {
          opacity: 0;
          transform: scale(1.1); /* Hace un pequeño zoom-out antes de desaparecer */
          pointer-events: none; /* Evita interacción */
        }
        @keyframes beat {
          0%{filter:  drop-shadow(0 0 2em #ffb14aaa)}
          50%{filter:  drop-shadow(0 0 0em #ffb14aaa)}
          100%{filter:  drop-shadow(0 0 2em #ffb14aaa)}
        }
    </style>
  </head>
  <body>
      <!-- Pantalla de carga -->
      <div id="loader">
        <div class="loader-container">
          <img class="loader-img" src="/logo-color.png" alt="Cargando..." />
        </div>
      </div>
      <script>
        document.addEventListener("DOMContentLoaded", function () {
          var loader = document.getElementById("loader");
          loader.style.opacity = "1"; // Asegura que el loader esté visible inicialmente
        });
      </script> 
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
