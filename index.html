<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ciudadano Consciente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link rel="icon" type="image/svg+xml" href="/loader.webp" />
    <link rel="preload" href="/logo.jpg" as="image">
    <style>
       /* Estilos para la pantalla de carga */
        #loader {
          position: fixed;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          background-color: inherit; /* Color de fondo */
          z-index: 9999; /* Z-index para asegurar que esté encima de todo */
          display: flex;
          justify-content: center;
          align-items: center;
        }
        .loader-container {
          display: flex;
          justify-content: center;
          align-items: center;
          width: 350px; 
          height: 350px; 
          border-radius: 50%; 
          overflow: hidden; 
          filter:   drop-shadow(0 0 2em #ffb14aaa);
          border-style: none;
          padding: 1em;
        }
        .loader-img {
          /* Estilos para la imagen de carga */
          width: 250px; /* Ancho de la imagen */
          height: 181px; /* Alto de la imagen */
          animation: beat 2s ease-in-out infinite; /* Animación de latido */
        }
        @keyframes beat {
          0%{filter:  drop-shadow(0 0 2em #ffb14aaa)}
          50%{filter:  drop-shadow(0 0 0em #ffb14aaa)}
          100%{filter:  drop-shadow(0 0 2em #ffb14aaa)}
        }
    </style>
  </head>
  <body>
      <!-- Pantalla de carga -->
      <div id="loader">
        <div class="loader-container">
          <img class="loader-img" src="/logo.jpg" alt="Cargando..." />
        </div>
      </div>
      <script>
        window.addEventListener('load', function() {
          var loader = document.getElementById('loader');
          loader.style.display = 'none'; // Oculta la pantalla de carga
        });
      </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
